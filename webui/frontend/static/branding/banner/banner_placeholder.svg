<?xml version="1.0" encoding="UTF-8"?>
<!--
  piTantum banner placeholder (1200x400). Wordmark + epigraph.
  Used by README.md and as social-preview fallback.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 400"
     width="1200" height="400"
     role="img" aria-label="piTantum">
  <title>piTantum - banner</title>

  <!-- Background: ivory -->
  <rect width="1200" height="400" fill="#f7f1de"/>

  <!-- Decorative laurel sprig top-left -->
  <g fill="#c9a23a" stroke="#1e3a5f" stroke-width="1.5" opacity="0.8">
    <ellipse cx="60" cy="80" rx="22" ry="9" transform="rotate(-30 60 80)" />
    <ellipse cx="92" cy="55" rx="22" ry="9" transform="rotate(-15 92 55)" />
    <ellipse cx="130" cy="42" rx="22" ry="9" transform="rotate(0 130 42)" />
    <ellipse cx="168" cy="55" rx="22" ry="9" transform="rotate(15 168 55)" />
    <ellipse cx="200" cy="80" rx="22" ry="9" transform="rotate(30 200 80)" />
  </g>
  <!-- Decorative laurel sprig bottom-right (mirrored) -->
  <g fill="#c9a23a" stroke="#1e3a5f" stroke-width="1.5" opacity="0.8">
    <ellipse cx="1000" cy="320" rx="22" ry="9" transform="rotate(-30 1000 320)" />
    <ellipse cx="1032" cy="345" rx="22" ry="9" transform="rotate(-15 1032 345)" />
    <ellipse cx="1070" cy="358" rx="22" ry="9" transform="rotate(0 1070 358)" />
    <ellipse cx="1108" cy="345" rx="22" ry="9" transform="rotate(15 1108 345)" />
    <ellipse cx="1140" cy="320" rx="22" ry="9" transform="rotate(30 1140 320)" />
  </g>

  <!-- Hourglass mark on the left -->
  <g transform="translate(170, 200)">
    <!-- pi -->
    <g fill="#1e3a5f">
      <rect x="-50" y="-60" width="100" height="14" rx="3"/>
      <rect x="-44" y="-46" width="14" height="92"/>
      <path d="M 28 -46 L 42 -46 L 42 36 Q 42 50 30 50 Q 18 50 18 38 L 28 38 Q 30 38 30 36 L 30 -46 Z"/>
    </g>
    <!-- hourglass between strokes -->
    <g>
      <path d="M -22 -34 L 22 -34 L 22 -20 L 0 0 L 22 20 L 22 34 L -22 34 L -22 20 L 0 0 L -22 -20 Z"
            fill="#f7f1de" stroke="#1e3a5f" stroke-width="2"/>
      <path d="M -18 -30 L 18 -30 L 0 -6 Z" fill="#c9a23a"/>
      <path d="M 0 6 L 18 30 L -18 30 Z" fill="#c9a23a"/>
    </g>
  </g>

  <!-- Wordmark -->
  <g font-family="'Cormorant Garamond', 'EB Garamond', Cardo, Georgia, serif"
     transform="translate(310, 215)">
    <text x="0" y="0" font-size="86" font-weight="600" fill="#1e3a5f">
      <tspan font-style="italic" fill="#c9a23a">&#960;</tspan>Tantum
    </text>
    <text x="0" y="36" font-size="22" font-style="italic" fill="#5a6477">
      Omnia, Lucili, aliena sunt, tempus tantum nostrum est.
    </text>
    <text x="0" y="62" font-size="14" fill="#9aa6b8">
      Seneca, Epistulae morales ad Lucilium, I, 1
    </text>
  </g>

  <!-- Bottom rule -->
  <line x1="60" y1="370" x2="1140" y2="370" stroke="#c9a23a" stroke-width="1.5" />
</svg>

<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e3a5f" />
    <title>piTantum - Orario scolastico</title>
    <meta name="description"
          content="piTantum (Tempus Tantum) -- Tutto, Lucilio, ci viene da altri; soltanto il tempo e' nostro. (Seneca, Ep. I,1) -- sistema di gestione e ottimizzazione dell'orario scolastico." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/branding/icons/favicon.svg" />
    <!-- PNG fallback + apple-touch-icon are intentionally NOT linked
         until Giovanni runs the Grok prompt in
         branding/icons/grok_prompts.md and drops the PNGs into
         webui/frontend/static/branding/icons/. The SVG favicon is
         supported by all modern browsers (Safari 14+, Chrome, Firefox,
         Edge); only old iOS home-screen needs the apple-touch-icon. -->
    <!-- <link rel="icon" type="image/png" href="/branding/icons/favicon.png" /> -->
    <!-- <link rel="apple-touch-icon" href="/branding/icons/apple-touch-icon.png" /> -->
    <!-- Redesign: Source Serif 4 per i titoli e il wordmark, IBM Plex Sans
         per il testo, IBM Plex Mono per i numeri e le etichette. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" />
    <!-- Polyfill crypto.randomUUID() for HTTP origins (Tailscale).
         Must be an external classic script (not inline, not a module)
         so it executes synchronously before any module imports. -->
    <script src="/polyfills.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" class="bg-paper text-ink-900 font-sans">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

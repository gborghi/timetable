<?xml version="1.0" encoding="UTF-8"?>
<!--
  piTantum favicon: minimal monogram (pi + hourglass), no laurel
  to remain readable at 16x16. Solid indigo background, gold pi.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 64 64"
     width="64" height="64">
  <title>piTantum</title>
  <!-- Background: rounded square indigo -->
  <rect x="0" y="0" width="64" height="64" rx="12" ry="12" fill="#1e3a5f"/>
  <!-- Pi (lowercase) -->
  <g fill="#c9a23a">
    <rect x="14" y="18" width="36" height="6" rx="1.5"/>
    <rect x="17" y="24" width="6" height="26"/>
    <path d="M 41 24 L 47 24 L 47 46 Q 47 50 43 50 Q 39 50 39 46 L 41 46 Q 41 47 42 47 Q 43 47 43 46 L 43 24 Z"/>
  </g>
  <!-- Hourglass between strokes -->
  <g>
    <path d="M 26 26 L 38 26 L 38 30 L 32 35 L 38 40 L 38 44 L 26 44 L 26 40 L 32 35 L 26 30 Z"
          fill="#f7f1de" stroke="#1e3a5f" stroke-width="0.8"/>
    <!-- sand -->
    <path d="M 27.5 27 L 36.5 27 L 32 33 Z" fill="#c9a23a"/>
    <path d="M 32 37 L 36.5 43 L 27.5 43 Z" fill="#c9a23a"/>
  </g>
</svg>

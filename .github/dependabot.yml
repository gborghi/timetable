version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/webui/backend"
    schedule:
      interval: "weekly"
    target-branch: "main"
    reviewers:
      - "gborghi"
    labels:
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/webui/frontend"
    schedule:
      interval: "weekly"
    target-branch: "main"
    reviewers:
      - "gborghi"
    labels:
      - "dependencies"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "main"
    reviewers:
      - "gborghi"
    labels:
      - "dependencies"

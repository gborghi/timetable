# Continuous integration: lint + unit tests + container builds.
#
# Triggers:
#   * push to any branch (so feature branches still get test feedback);
#   * pull_request to main (mandatory gate).
#
# Jobs:
#   1. backend-lint  -- ruff check (style + obvious bugs).
#   2. backend-test  -- pytest, excluding the `slow` marker (full
#      CP-SAT pipeline tests are opt-in via -m slow locally).
#   3. frontend-build -- svelte-check + vite build + the small node:test
#      suite already in package.json.
#   4. docker-build  -- buildx build of both Dockerfiles to catch
#      regressions in COPY paths / dependency installs.
#
# Each job runs on ubuntu-latest with a reasonable timeout so a hung
# test can't burn an hour of runner time.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: backend / ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install ruff
        run: pip install 'ruff>=0.5'
      - name: Ruff check
        # Limit to webui/ so the engine/ + schedule/ legacy scientific
        # code (which has its own style and intentional star-imports)
        # doesn't block CI. Extend later.
        run: ruff check webui/

  backend-test:
    name: backend / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: webui/backend/requirements.txt
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r webui/backend/requirements.txt
      - name: Run pytest (fast suite)
        working-directory: webui
        env:
          PYTHONPATH: ${{ github.workspace }}/webui:${{ github.workspace }}/engine:${{ github.workspace }}/schedule
        run: |
          pytest backend/tests \
            -m "not slow" \
            --maxfail=5 \
            -q

  frontend-build:
    name: frontend / build + check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint (svelte-check)
        run: npm run check
      - name: Unit tests (node:test)
        run: npm test
      - name: Build
        run: npm run build

  docker-build:
    name: docker / build images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend-test, frontend-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webui/backend/Dockerfile
          push: false
          tags: pitantum-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Build frontend prod image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: webui/frontend/Dockerfile
          target: prod
          push: false
          tags: pitantum-frontend-prod:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

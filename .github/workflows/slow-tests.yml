name: Slow tests (CP-SAT pipelines)

on:
  schedule:
    # Nightly at 03:57 UTC
    - cron: '57 3 * * *'
  workflow_dispatch:  # manual trigger

jobs:
  slow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r webui/backend/requirements.txt
          pip install pytest pytest-timeout

      - name: Run slow tests
        working-directory: webui
        env:
          PYTHONPATH: ${{ github.workspace }}/webui:${{ github.workspace }}/engine:${{ github.workspace }}/schedule
        run: |
          python -m pytest backend/tests -m slow \
            --timeout 600 \
            --tb=short \
            -ra \
            --maxfail=10
